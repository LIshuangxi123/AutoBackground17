name: Build deb

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore: [ "build.log", "dist/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        env:
          THEOS: /opt/theos
        run: |
          sudo mkdir -p "$THEOS"
          sudo chown "$(whoami)" "$THEOS"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"

      - name: Setup iOS SDK (from Xcode)
        env:
          THEOS: /opt/theos
        run: |
          mkdir -p "$THEOS/sdks"
          XCODE_SDK="/Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk"
          cp -RL "$XCODE_SDK" "$THEOS/sdks/iPhoneOS17.sdk"
          ls -la "$THEOS/sdks/"

      - name: Install build tools (dpkg, ldid)
        run: brew install dpkg ldid

      - name: Build package
        env:
          THEOS: /opt/theos
        run: |
          set +e
          ls "$THEOS/sdks/iPhoneOS17.sdk/System/Library/PrivateFrameworks/" | grep -i -E "preferences|coreservices" || true
          make clean package FINALPACKAGE=1 VERBOSE=1 2>&1 | tee build.log
          EXIT=${PIPESTATUS[0]}
          ls -la packages/ 2>/dev/null || true
          echo "MAKE_EXIT=$EXIT"
          exit $EXIT

      - name: Publish build.log to repo (debug)
        if: failure()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add build.log
          git commit -m "debug: build log" || true
          git push origin HEAD:main || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log


      - name: Publish deb to repo (dist)
        if: success()
        run: |
          mkdir -p dist
          cp packages/*.deb dist/ 2>/dev/null || true
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add dist/
          git commit -m "build: publish deb" || true
          git push origin HEAD:main || true
      - name: Upload deb artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AutoBackground17-deb
          path: packages/*.deb